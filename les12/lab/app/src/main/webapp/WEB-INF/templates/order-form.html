<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Форма заказа</title>
</head>
<body>
    <h1 th:text="${order.id == null ? 'Создание заказа' : 'Редактирование заказа'}"></h1>

    <form th:action="@{/orders/save}" method="post">
        <input type="hidden" name="id" th:value="${order.id}">
        
        <label>Клиент:</label><br>
        <select name="customerId" required>
            <option th:each="c : ${customers}" 
                    th:value="${c.id}" 
                    th:text="${c.name}"
                    th:selected="${order.customer != null && order.customer.id == c.id}">
            </option>
        </select><br><br>

        <label>Сумма заказа:</label><br>
        <input type="number" step="0.01" name="totalPrice" th:value="${order.totalPrice}" required><br><br>

        <button type="submit">Сохранить</button>
        <a th:href="@{/orders}">Отмена</a>
    </form>
</body>
</html>
